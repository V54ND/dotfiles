theme = "ayu_mirage_white_linenr"

[editor]
line-number = "relative"
mouse = true
cursorline = true
cursorcolumn = false

bufferline = "multiple"
color-modes = true
true-color = true

completion-trigger-len = 1
idle-timeout = 250
scrolloff = 8

popup-border = "all"
end-of-line-diagnostics = "warning"

shell = ["bash", "-c"]

[editor.file-picker]
hidden = false
follow-symlinks = true

[editor.search]
smart-case = true
wrap-around = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 1

[editor.soft-wrap]
enable = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "disable"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name"]
center = ["file-modification-indicator"]
right = ["diagnostics", "selections", "position", "position-percentage", "file-type"]
separator = "│"

[keys.normal]
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"

"A-j" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"A-k" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

[keys.normal.space]
l = '@miw"vygloconsole.log("<C-r>v:", <C-r>v);<esc>'
