"$schema" = "https://starship.rs/config-schema.json"

# Cross-platform cyberpunk prompt. The first line shows shell and repository
# context; the second line contains the input character.
add_newline = true
scan_timeout = 30
command_timeout = 800
continuation_prompt = "[│](bright-black)  "

format = """
[╭─](bright-black)[//](bold purple) \
$os\
$shell\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$package\
$python\
$rust\
$docker_context\
$kubernetes\
$cmd_duration\
$jobs\
$battery\
${custom.error_count}\
$status\
$time
[╰─](bright-black)\
$character"""

# All colors use the terminal's ANSI palette and adapt to its active theme.

# Context modules shown on the top prompt line.
[os]
disabled = false
format = "[$symbol]($style)"
style = "bold bright-cyan"

[os.symbols]
Windows = " "
Macos = " "
Linux = " "

[shell]
disabled = false
format = "[$indicator]($style)"
style = "bold bright-purple"
bash_indicator = " "
zsh_indicator = "󰰶 "
powershell_indicator = " "
pwsh_indicator = " "
unknown_indicator = " "

[username]
show_always = false
format = "[$user]($style)[@](bright-black)"
style_user = "bold bright-purple"
style_root = "bold bright-red"

[hostname]
ssh_only = true
trim_at = "."
format = "[$hostname]($style) "
style = "bold bright-cyan"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold bright-yellow"
read_only = " 󰌾"
read_only_style = "bold bright-red"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold bright-purple"
truncation_length = 28

[git_state]
format = "[$state( $progress_current/$progress_total)]($style)"
style = "bold bright-purple"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "bold bright-red"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = '\$${count} '
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Right-aligned runtime and status information.
[fill]
symbol = "╍"
style = "bright-black"

[nodejs]
format = "[ $symbol$version]($style) "
symbol = " "
style = "bold bright-cyan"

[package]
format = "[ $symbol$version]($style) "
symbol = "󰏗 "
style = "bold bright-yellow"

[python]
format = '[ $symbol$version( \($virtualenv\))]($style) '
symbol = " "
style = "bold bright-yellow"

[rust]
format = "[ $symbol$version]($style) "
symbol = " "
style = "bold bright-red"

[docker_context]
format = "[ $symbol$context]($style) "
symbol = " "
style = "bold bright-cyan"

[kubernetes]
disabled = false
format = '[ $symbol$context(\($namespace\))]($style) '
symbol = "󱃾 "
style = "bold bright-purple"

[cmd_duration]
min_time = 1500
format = "[◈ $duration]($style) "
style = "bold bright-yellow"

[jobs]
symbol = "󰜎 "
number_threshold = 1
format = "[$symbol$number]($style) "
style = "bold bright-cyan"

[battery]
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 20
style = "bold bright-red"

[[battery.display]]
threshold = 50
style = "bold bright-yellow"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "⨯ "
style = "bold bright-red"
map_symbol = true
pipestatus = true
pipestatus_separator = " "

[custom.error_count]
description = "Number of failed commands recorded by the Bash prompt hook"
command = "log=\"${XDG_STATE_HOME:-$HOME/.local/state}/bash/errors.log\"; [ -s \"$log\" ] && wc -l < \"$log\""
when = "test -s \"${XDG_STATE_HOME:-$HOME/.local/state}/bash/errors.log\""
format = "[✗$output]($style) "
style = "bold bright-red"
shell = ["bash", "--noprofile", "--norc", "-c"]

[time]
disabled = false
time_format = "%H:%M"
format = "[│ ◷ $time]($style)"
style = "bold bright-cyan"

# Prompt character colour reflects the previous command status.
[character]
success_symbol = "[❯](bold bright-green)"
error_symbol = "[❯](bold bright-red)"
vimcmd_symbol = "[❮](bold bright-green)"
vimcmd_replace_one_symbol = "[❮](bold bright-purple)"
vimcmd_replace_symbol = "[❮](bold bright-purple)"
vimcmd_visual_symbol = "[❮](bold bright-yellow)"
