"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "kanagawa"
scan_timeout = 30
command_timeout = 800
continuation_prompt = "[│](muted)  "

format = """
[╭─](muted)\
$os\
$shell\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$package\
$python\
$rust\
$docker_context\
$kubernetes\
$cmd_duration\
$jobs\
$battery\
$status\
$time
[╰─](muted)\
$character"""

[palettes.kanagawa]
foreground = "#DCD7BA"
muted = "#727169"
surface = "#1F1F28"
blue = "#7E9CD8"
aqua = "#6A9589"
green = "#98BB6C"
violet = "#957FB8"
pink = "#D27E99"
yellow = "#E6C384"
orange = "#FFA066"
red = "#C34043"

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold blue"

[os.symbols]
Windows = " "
Macos = " "
Linux = " "

[shell]
disabled = false
format = "[$indicator]($style)"
style = "bold violet"
bash_indicator = " "
zsh_indicator = "󰰶 "
powershell_indicator = " "
pwsh_indicator = " "
unknown_indicator = " "

[username]
show_always = false
format = "[$user]($style)[@](muted)"
style_user = "bold violet"
style_root = "bold red"

[hostname]
ssh_only = true
trim_at = "."
format = "[$hostname]($style) "
style = "bold blue"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold violet"
truncation_length = 28

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = '\$${count} '
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = "─"
style = "muted"

[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold green"

[package]
format = "[$symbol$version]($style) "
symbol = "󰏗 "
style = "bold orange"

[python]
format = '[$symbol$version( \($virtualenv\))]($style) '
symbol = " "
style = "bold yellow"

[rust]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold red"

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
style = "bold blue"

[kubernetes]
disabled = false
format = '[$symbol$context(\($namespace\))]($style) '
symbol = "󱃾 "
style = "bold aqua"

[cmd_duration]
min_time = 1500
format = "[󱎫 $duration]($style) "
style = "bold yellow"

[jobs]
symbol = "󰜎 "
number_threshold = 1
format = "[$symbol$number]($style) "
style = "bold aqua"

[battery]
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "󰅖 "
style = "bold red"
map_symbol = true
pipestatus = true
pipestatus_separator = " "

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style)"
style = "bold foreground"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold violet)"
vimcmd_replace_symbol = "[❮](bold violet)"
vimcmd_visual_symbol = "[❮](bold yellow)"
